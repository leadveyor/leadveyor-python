name: Publish to PyPI

# Runs when a GitHub release is published (tag vX.Y.Z). Uses PyPI Trusted Publishing: no API token is stored.
# One-time setup on pypi.org → Account → Publishing → Add a new pending publisher:
#   PyPI project name: leadveyor · Owner: leadveyor · Repository: leadveyor-python · Workflow: publish.yml · Environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/leadveyor/_version.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
