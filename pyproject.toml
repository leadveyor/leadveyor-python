[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "leadveyor"
version = "0.3.0"
description = "Official Python client for the Leadveyor API: lead scoring, sources, webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Leadveyor", email = "support@leadveyor.com" }]
keywords = ["leadveyor", "lead scoring", "leads", "crm", "api", "sdk", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = ["httpx>=0.23.0,<1"]

[project.urls]
Homepage = "https://leadveyor.com"
Documentation = "https://leadveyor.com/docs/sdk/python"
"API reference" = "https://leadveyor.com/docs/api"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/leadveyor"]

[tool.hatch.build.targets.sdist]
include = ["src/leadveyor", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src/leadveyor"]
